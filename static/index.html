<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unattended baggage</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="brand">Practice2026</div>
      <div class="title">Забытый багаж</div>
      <div class="subtitle">YOLO11s (COCO) • bbox только если багаж считается “забытым”</div>
    </header>

    <section class="controls">
      <div class="row">
        <button id="btnCamera" class="btn">Камера</button>
        <button id="btnShot" class="btn btn-secondary" disabled>Снимок</button>

        <label class="btn btn-secondary file-btn">
          Загрузить фото
          <input id="fileInput" type="file" accept="image/*" hidden />
        </label>

        <button id="btnRun" class="btn btn-primary" disabled>Запустить обработку</button>
      </div>

      <div class="row">
        <label class="field">
          conf
          <input id="conf" type="number" step="0.05" min="0.05" max="0.95" value="0.25" />
        </label>
        <label class="field">
          dist_thr
          <input id="dist" type="number" step="0.1" min="0.2" max="6.0" value="1.0" />
        </label>
        <label class="field">
          person_conf
          <input id="pconf" type="number" step="0.05" min="0.05" max="0.95" value="0.50" />
        </label>
        <label class="field">
          min_area_ratio
          <input id="aratio" type="number" step="0.5" min="0.5" max="20.0" value="3.0" />
        </label>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Предпросмотр</div>
      <div class="preview">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" width="640" height="480"></canvas>
        <img id="previewImg" alt="preview" />
      </div>
      <div class="hint" id="hint">Нажмите «Камера» или «Загрузить фото»</div>
    </section>

    <section class="panel">
      <div class="panel-title">Результат</div>
      <img id="resultImg" alt="result" class="result" />
      <div id="list" class="list"></div>
    </section>

    <section class="panel">
      <div class="panel-title">Статистика</div>

      <div class="stats">
        <div class="stat">
          <div class="muted">Всего запросов</div>
          <div id="stTotal" class="stat-num">0</div>
        </div>
        <div class="stat">
          <div class="muted">Запросов с забытым</div>
          <div id="stWith" class="stat-num">0</div>
        </div>
        <div class="stat">
          <div class="muted">Забытых объектов всего</div>
          <div id="stBags" class="stat-num">0</div>
        </div>
        <div class="stat">
          <div class="muted">Доля</div>
          <div id="stRate" class="stat-num">0%</div>
        </div>
      </div>

      <div class="row">
        <button id="btnRefresh" class="btn btn-secondary">Обновить</button>
        <a class="btn btn-primary" href="/report.xlsx" target="_blank" rel="noopener">Скачать Excel</a>
      </div>

      <div class="panel-title" style="margin-top:10px;">Последние запросы</div>
      <div id="historyList" class="list"></div>
    </section>

  </div>

  <script src="/static/app.js"></script>
</body>
</html>
